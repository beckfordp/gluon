# SPDX-License-Identifier: MIT
# The Rust cart-service (all-Rust Stage A), installed by bin/k8s-local-up
# under the same release name, `cart-service`, when CART_SERVICE_IMPL=rust.
# The same env vars as cart-service.values.yaml; the chart's JVM-only
# settings blanked (the chart renders them only when non-empty).
image:
  repository: cart-service-rs
  tag: latest

javaOpts: ""
mallocArenaMax: ""

env:
  # Spans over OTLP/HTTP to Tempo (bin/obs; ADR 0021), as the Scala service.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://tempo:4318
  - name: REDIS_URI
    value: redis://cart-redis:6379
