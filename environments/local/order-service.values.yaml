image:
  repository: order-service
  tag: latest

env:
  # PERF-5.3: spans over OTLP/HTTP to Tempo (bin/obs; ADR 0021). With the
  # obs stack down the exporter drops them, logging one "Failed to export"
  # line per batch; the service is otherwise unaffected.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://tempo:4318
  - name: POSTGRES_HOST
    value: order-postgres
  - name: POSTGRES_DB
    value: order
  - name: POSTGRES_USER
    value: order
  - name: POSTGRES_PASSWORD
    value: order
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: kafka:9092
  - name: REDIS_URI
    value: redis://order-redis:6379
  - name: INVENTORY_SERVICE_URL
    value: http://inventory-service:8080
  - name: PAYMENT_SERVICE_URL
    value: http://payment-service:8080

