# SPDX-License-Identifier: MIT
# The Rust inventory-service (all-Rust Stage A), installed by bin/k8s-local-up
# under the same release name, `inventory-service`, when INVENTORY_SERVICE_IMPL=rust.
# The same env vars as inventory-service.values.yaml; the chart's JVM-only
# settings blanked (the chart renders them only when non-empty).
image:
  repository: inventory-service-rs
  tag: latest

javaOpts: ""
mallocArenaMax: ""

env:
  # Spans over OTLP/HTTP to Tempo (bin/obs; ADR 0021), as the Scala service.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://tempo:4318
  - name: POSTGRES_HOST
    value: inventory-postgres
  - name: POSTGRES_DB
    value: inventory
  - name: POSTGRES_USER
    value: inventory
  - name: POSTGRES_PASSWORD
    value: inventory
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: kafka:9092
