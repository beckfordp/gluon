# SPDX-License-Identifier: MIT

image:
  repository: payment-service
  tag: latest

env:
  # PERF-5.3: spans over OTLP/HTTP to Tempo (bin/obs; ADR 0021). With the
  # obs stack down the exporter drops them, logging one "Failed to export"
  # line per batch; the service is otherwise unaffected.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://tempo:4318
  - name: POSTGRES_HOST
    value: payment-postgres
  - name: POSTGRES_DB
    value: payment
  - name: POSTGRES_USER
    value: payment
  - name: POSTGRES_PASSWORD
    value: payment
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: kafka:9092
  # US-20.1: short sweep interval so verify-auth-expiry.sh need not wait 30s.
  - name: PAYMENT_EXPIRY_SWEEP_INTERVAL
    value: 5s
