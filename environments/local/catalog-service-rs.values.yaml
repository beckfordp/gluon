# SPDX-License-Identifier: MIT
# The Rust catalog-service (all-Rust Stage A), installed by bin/k8s-local-up
# under the same release name, `catalog-service`, when CATALOG_SERVICE_IMPL=rust.
# The same env vars as catalog-service.values.yaml; the chart's JVM-only
# settings blanked (the chart renders them only when non-empty).
image:
  repository: catalog-service-rs
  tag: latest

javaOpts: ""
mallocArenaMax: ""

env:
  # Spans over OTLP/HTTP to Tempo (bin/obs; ADR 0021), as the Scala service.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://tempo:4318
  - name: POSTGRES_HOST
    value: catalog-postgres
  - name: POSTGRES_DB
    value: catalog
  - name: POSTGRES_USER
    value: catalog
  - name: POSTGRES_PASSWORD
    value: catalog
  - name: REDIS_URI
    value: redis://catalog-redis:6379
