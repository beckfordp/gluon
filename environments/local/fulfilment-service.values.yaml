image:
  repository: fulfilment-service
  tag: latest

env:
  # PERF-5.3: spans over OTLP/HTTP to Tempo (bin/obs; ADR 0021). With the
  # obs stack down the exporter drops them, logging one "Failed to export"
  # line per batch; the service is otherwise unaffected.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://tempo:4318
  - name: POSTGRES_HOST
    value: fulfilment-postgres
  - name: POSTGRES_DB
    value: fulfilment
  - name: POSTGRES_USER
    value: fulfilment
  - name: POSTGRES_PASSWORD
    value: fulfilment
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: kafka:9092
  - name: ORDER_SERVICE_URL
    value: http://order-service:8080
  - name: FULFILMENT_SIMULATION_ENABLED
    value: "true"
