# Broker-side Kafka consumer-group lag per topic/partition (PLAN.md
# PERF-3.1, Q3/Q14): cross-checks purekafka's own in-process lag gauge.
# Kafka Connect/Debezium metrics come from Connect's JMX agent instead
# (infra/k8s/local-infra/kafka-connect.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.9.0
          args:
            - --kafka.server=kafka:9092
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Laptop budget (environments/local/README.md): request = limit.
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 64Mi
          ports:
            - name: http
              containerPort: 9308
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
spec:
  selector:
    app: kafka-exporter
  ports:
    - name: http
      port: 9308
      targetPort: 9308
