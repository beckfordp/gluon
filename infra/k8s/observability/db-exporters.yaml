# Postgres and Redis exporters (PLAN.md PERF-3.1), one multi-target
# exporter each rather than one per instance (6 Postgres + 3 Redis would be
# 9 pods). Prometheus passes the instance as ?target= (config/prometheus.yml)
# and, for Postgres, the matching auth module.
#
# Credentials are local-infra's own dev defaults (user = password = db name,
# infra/k8s/local-infra/postgres-*.yaml); nothing here is a real secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-config
data:
  postgres_exporter.yml: |
    auth_modules:
      catalog:
        type: userpass
        userpass: {username: catalog, password: catalog}
        options: {sslmode: disable}
      fulfilment:
        type: userpass
        userpass: {username: fulfilment, password: fulfilment}
        options: {sslmode: disable}
      inventory:
        type: userpass
        userpass: {username: inventory, password: inventory}
        options: {sslmode: disable}
      order:
        type: userpass
        userpass: {username: order, password: order}
        options: {sslmode: disable}
      payment:
        type: userpass
        userpass: {username: payment, password: payment}
        options: {sslmode: disable}
      user:
        type: userpass
        userpass: {username: user, password: user}
        options: {sslmode: disable}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          args:
            - --config.file=/etc/postgres-exporter/postgres_exporter.yml
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Laptop budget (environments/local/README.md): request = limit.
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 64Mi
          ports:
            - name: http
              containerPort: 9187
          volumeMounts:
            - name: config
              mountPath: /etc/postgres-exporter
      volumes:
        - name: config
          configMap:
            name: postgres-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
spec:
  selector:
    app: postgres-exporter
  ports:
    - name: http
      port: 9187
      targetPort: 9187
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.74.0
          securityContext:
            runAsNonRoot: true
            runAsUser: 59000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Laptop budget (environments/local/README.md): request = limit.
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 32Mi
          ports:
            - name: http
              containerPort: 9121
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
spec:
  selector:
    app: redis-exporter
  ports:
    - name: http
      port: 9121
      targetPort: 9121
