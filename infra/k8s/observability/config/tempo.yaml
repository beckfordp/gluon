# SPDX-License-Identifier: MIT
# Tempo for gluon-local (ADR 0021, PLAN.md PERF-5.3): single binary, local
# disk, 1-day retention. Services export OTLP over HTTP (:4318; purerest
# 0.10.0 has no gRPC sender); Grafana queries :3200.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
# Short blocks: less trace data held in memory at 256Mi.
ingester:
  trace_idle_period: 10s
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 24h
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
usage_report:
  reporting_enabled: false
