# Opt-in observability stack for gluon-local (PLAN.md Performance 3,
# PERF-3.1–3.4, PERF-5.3): Prometheus + exporters, Elasticsearch/Kibana/Filebeat,
# Grafana, Tempo. Managed by bin/obs up|down, never by bin/k8s-local-up — it costs
# ~3.3Gi of the 16Gi laptop budget (see environments/local/README.md).
#
# Every object, and every pod template, carries
# app.kubernetes.io/part-of=gluon-obs: bin/lib/obs-budget.sh sums the
# stack's memory by it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gluon-local
labels:
  - pairs:
      app.kubernetes.io/part-of: gluon-obs
    includeTemplates: true
resources:
  - prometheus.yaml
  - alertmanager.yaml
  - cadvisor.yaml
  - kube-state-metrics.yaml
  - db-exporters.yaml
  - kafka-exporter.yaml
  - elasticsearch-kibana.yaml
  - filebeat.yaml
  - grafana.yaml
  - tempo.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - config/prometheus.yml
      - config/rules/reconciliation.yml
  - name: alertmanager-config
    files:
      - config/alertmanager.yml
  - name: filebeat-config
    files:
      - config/filebeat.yml
  - name: tempo-config
    files:
      - config/tempo.yaml
  - name: grafana-datasources
    files:
      - config/grafana/datasources.yml
  - name: grafana-dashboard-providers
    files:
      - config/grafana/dashboards.yml
  # One ConfigMap per Grafana folder (ADR 0027), generated by
  # bin/obs-dashboards — edit infra/k8s/observability/dashboards/, not the JSON.
  - name: grafana-dashboards-overview
    files:
      - config/grafana/dashboards/1-Overview/gluon-christmas-rush.json
  - name: grafana-dashboards-services
    files:
      - config/grafana/dashboards/2-Services/gluon-service.json
      - config/grafana/dashboards/2-Services/gluon-checkout.json
      - config/grafana/dashboards/2-Services/gluon-dispatch.json
  - name: grafana-dashboards-platform
    files:
      - config/grafana/dashboards/3-Platform/gluon-pods.json
      - config/grafana/dashboards/3-Platform/gluon-data-stores.json
      - config/grafana/dashboards/3-Platform/gluon-kafka.json
