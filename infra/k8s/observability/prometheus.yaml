# Prometheus for gluon-local (PLAN.md PERF-3.1). Scrapes:
#   - every service, found by Kubernetes service discovery on an
#     EndpointSlice port named `metrics` (infra/k8s/gluon's Service already
#     names it), so a new service is picked up with no config change
#   - cAdvisor (pod CPU, memory, CFS throttling; see cadvisor.yaml for why
#     not the kubelet's built-in one)
#   - kube-state-metrics, postgres/redis exporters (multi-target),
#     kafka-exporter and Kafka Connect's JMX agent
# Scrape config: config/prometheus.yml (a configMapGenerator in
# kustomization.yaml, so editing it rolls this Deployment on `bin/obs up`).
# Short retention on an emptyDir: this answers "what happened in this run",
# not long-term trends.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  # emptyDir data dies with the pod anyway; Recreate keeps a rollout from
  # briefly running two Prometheus pods against the memory budget.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.3
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            - --storage.tsdb.retention.size=1GB
            - --web.enable-lifecycle
          # Laptop budget (environments/local/README.md): request = limit.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir:
            sizeLimit: 2Gi
---
# OrbStack serves LoadBalancer services on localhost: http://localhost:9092
# (9092 not 9090: the services' own metrics ports are 9090).
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: LoadBalancer
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9092
      targetPort: 9090
