# SPDX-License-Identifier: MIT
# Grafana for gluon-local (PLAN.md PERF-3.3). Datasource and dashboards are
# provisioned from files in config/grafana/ (configMapGenerators in
# kustomization.yaml, so a regenerated dashboard rolls Grafana on
# `bin/obs up`). Dashboards are generated by bin/obs-dashboards (ADR 0027,
# docs/observability/dashboards.md); UI edits are not saved.
#
# Anonymous Viewer (Grafana 13 allows no other anonymous role), with Explore
# opened to viewers; admin/admin logs in for anything else. Local-only demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  # bin/obs up picks a UI by this label (metrics|logs|all profiles).
  labels:
    gluon-obs/ui: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana-oss:13.0.2
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_USERS_VIEWERS_CAN_EDIT
              value: "true"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            # Prometheus only: no background plugin installs (and none onto
            # the read-only root filesystem).
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            # WAL: provisioning and the first UI requests otherwise hit SQLite
            # "database is locked" retries (TD-25).
            - name: GF_DATABASE_WAL
              value: "true"
            # TD-25.4: Go's GC ignores the cgroup limit and lets the heap reach
            # ~2x live before collecting, so a 165Mi peak overshot 256Mi.
            # GOMEMLIMIT makes it collect first; the rest is page cache.
            - name: GOMEMLIMIT
              value: 200MiB
            # TD-25.4: fewer Prometheus responses decoded at once when every
            # panel of a dashboard fires together.
            - name: GF_DATAPROXY_MAX_CONNS_PER_HOST
              value: "4"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/1-Overview/gluon-christmas-rush.json
          securityContext:
            runAsNonRoot: true
            runAsUser: 472
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Laptop budget (environments/local/README.md): request = limit.
          # TD-25: 192Mi was OOM-killed on the first dashboard-list load;
          # measured 165Mi anon at peak (all 7 dashboards' queries at once).
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards-overview
              mountPath: /var/lib/grafana/dashboards/1-Overview
            - name: dashboards-services
              mountPath: /var/lib/grafana/dashboards/2-Services
            - name: dashboards-platform
              mountPath: /var/lib/grafana/dashboards/3-Platform
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: dashboards-overview
          configMap:
            name: grafana-dashboards-overview
        - name: dashboards-services
          configMap:
            name: grafana-dashboards-services
        - name: dashboards-platform
          configMap:
            name: grafana-dashboards-platform
---
# OrbStack serves LoadBalancer services on localhost: http://localhost:3000
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    gluon-obs/ui: grafana
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
