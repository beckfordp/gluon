apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      # Every service's own <NAME>_SERVICE_PORT env var (e.g.
      # CATALOG_SERVICE_PORT) collides with k8s's own auto-injected
      # Docker-links-style env vars for a Service named "catalog-service" —
      # k8s would inject CATALOG_SERVICE_PORT=tcp://<ip>:8080 (a URI
      # string), breaking pureconfig's NUMBER parse of our own same-named
      # var. Disable that injection; nothing here relies on it — every
      # cross-service address is passed explicitly via `env` instead.
      enableServiceLinks: false
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          env:
            {{- with .Values.javaOpts }}
            - name: JAVA_OPTS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.mallocArenaMax }}
            - name: MALLOC_ARENA_MAX
              value: {{ . | quote }}
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          # Startup (Flyway, Kafka group join) can take ~15s on a busy laptop;
          # the startup probe holds liveness off until the first success.
          startupProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: {{ .Values.port }}
            periodSeconds: 2
            failureThreshold: 60
          # Generous timeout/threshold: at the 500m CPU limit a GC pause under
          # acceptance load can exceed 1s, and a liveness kill then takes the
          # service down mid-run.
          livenessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: {{ .Values.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: {{ .Values.readyPath }}
              port: {{ .Values.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
