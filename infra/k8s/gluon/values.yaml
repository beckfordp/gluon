# SPDX-License-Identifier: MIT
# Defaults for the generic Gluon workload chart. Every real value below is
# overridden per workload by its own small values fragment under
# gluon/environments/<env>/<name>.values.yaml — nothing workload-specific
# belongs in this file.
replicaCount: 1

image:
  repository: CHANGE_ME
  tag: latest
  # No registry involved for local dev — sbt's `Docker/publishLocal` (or an
  # equivalent frontend build) puts the image straight into the cluster's
  # own docker daemon (OrbStack shares it natively), so there's nothing to
  # pull.
  pullPolicy: Never

port: 8080
metricsPort: 9090

# Every Gluon service already serves these two real routes (see e.g.
# services/catalog-service/src/main/scala/catalogservice/HealthRoutes.scala)
# — reused directly as liveness/readiness probes rather than inventing a
# chart-specific health convention.
healthPath: /health
readyPath: /health/ready

env: []

# Rendered as JAVA_OPTS, which every service's native-packager launcher
# honours. Heap is sized from the container limit, not a fixed -Xmx, so it
# tracks `resources` below (PLAN.md laptop budget, PERF-2.3). 40%, not the
# usual 75%: off-heap is ~250Mi once warm (TD-27 NMT: metaspace ~110Mi, code
# cache ~57Mi, symbols ~37Mi, class space, CDS), so at 512Mi a 40% heap
# (≈205Mi) peaks near 475Mi.
javaOpts: "-XX:MaxRAMPercentage=40"

# Rendered as MALLOC_ARENA_MAX. glibc's default (8 × cores) leaves ~75Mi of
# malloc arenas that NMT doesn't track; 2 saves ~55Mi of RSS (TD-27).
mallocArenaMax: "2"

# Laptop budget (PLAN.md "Demo, not capacity"): tight, explicit limits so
# pods saturate before the host does. Memory request = limit (no
# overcommit); CPU may burst from 250m to 500m. 512Mi, not 384Mi: warm
# services reach 330-410Mi RSS, and at 384Mi they were OOMKilled under
# acceptance-suite load (TD-27).
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 512Mi
