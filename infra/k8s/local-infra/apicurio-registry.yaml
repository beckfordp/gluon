# Apicurio Registry (ADR 0003's Rework 5): compatibility-check backend for
# each Kafka event's JSON Schema, derived from the same tapir `Schema[T]`
# already used for AsyncAPI generation (ADR 0010). Checked/registered at
# build time only (a new purerest sbt task) - this service has zero
# presence on the runtime produce/consume path, by design (see ADR 0003's
# 2026-10-25 note): messages stay plain `StringConverter` JSON on the wire
# (no registry-aware Connect converter), so a registry outage never blocks
# a running service, consistent with Rework 3's StreamSupervisor/DeadLetter
# resilience work.
#
# Storage: left unconfigured deliberately - Apicurio Registry 3.x's
# default when APICURIO_STORAGE_KIND is unset is SQL storage with an
# embedded H2 database (no external DB container needed; confirmed live
# 2026-10-25 - "mem" is not a valid value in this version, it errors with
# "No Registry storage variant defined for value mem"). Local-dev-only,
# mirrors every other local-infra component's own ephemeral-storage
# convention (even Postgres here uses a plain `emptyDir`, not a real PVC -
# see postgres-catalog.yaml). Schemas don't survive a pod restart, but the
# source of truth is the code; the build-time task just
# re-registers/validates on every run anyway, so restart-loses-data is
# low-stakes for this local-only, single-developer setup. KafkaSQL storage
# (reusing the already-deployed broker, surviving restarts) is a
# reasonable future upgrade if that changes, not needed now.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio-registry
  namespace: gluon-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apicurio-registry
  template:
    metadata:
      labels:
        app: apicurio-registry
    spec:
      containers:
        - name: apicurio-registry
          image: apicurio/apicurio-registry:3.3.2
          # Laptop budget (gluon PLAN.md, PERF-2.3): memory request = limit.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 8080
            - containerPort: 9000
          env:
            # run-java.sh defaults to MaxRAMPercentage=80, which OOMs under the 512Mi limit.
            - name: JAVA_MAX_MEM_RATIO
              value: "50"
            # Default CORS allow-list is just localhost:8888/127.0.0.1:8888
            # (confirmed live: a real browser request from
            # apicurio-registry-ui's own cluster-DNS origin got a 403 "CORS
            # Rejected - Invalid origin") - allow-all, same local-dev-only
            # convention this repo's own generated services' CORS fix uses
            # (TD-1).
            - name: QUARKUS_HTTP_CORS_ORIGINS
              value: "*"
            # All three deletion toggles default to false (confirmed live:
            # DELETE on an artifact or a whole group both 405'd) - enabled
            # here so stale local-dev artifacts (e.g. left over from a
            # schemaRegistryGroupId change) can actually be cleaned up,
            # same local-dev-only "allow it" posture as CORS above. Storage
            # is ephemeral anyway (see this file's own storage comment
            # above), so this isn't guarding anything real here.
            - name: APICURIO_REST_DELETION_ARTIFACT_ENABLED
              value: "true"
            - name: APICURIO_REST_DELETION_ARTIFACT_VERSION_ENABLED
              value: "true"
            - name: APICURIO_REST_DELETION_GROUP_ENABLED
              value: "true"
          readinessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                # Health endpoints are served on the separate Quarkus
                # "management interface" port (9000), not the main REST
                # API/UI port (8080) - confirmed live 2026-10-25: curling
                # 8080/health/ready 404s.
                - http://localhost:9000/health/ready
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: apicurio-registry
  namespace: gluon-local
spec:
  selector:
    app: apicurio-registry
  ports:
    - port: 8080
      targetPort: 8080
