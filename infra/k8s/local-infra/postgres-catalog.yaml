apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-postgres
  namespace: gluon-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-postgres
  template:
    metadata:
      labels:
        app: catalog-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "catalog"
            - name: POSTGRES_USER
              value: "catalog"
            - name: POSTGRES_PASSWORD
              value: "catalog"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "catalog"]
            initialDelaySeconds: 2
            periodSeconds: 2
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-postgres
  namespace: gluon-local
spec:
  selector:
    app: catalog-postgres
  ports:
    - port: 5432
      targetPort: 5432
