# Single Kafka Connect worker, running the Debezium Postgres connector
# plugin (bundled in the debezium/connect image, no custom Dockerfile) —
# local-dev-only, mirrors kafka.yaml's single-broker/single-worker shape.
# Delivers rows from each service's outbox_events table to its domain
# topic (ADR 0008) — see debezium-connectors-register.yaml for the actual
# per-service connector configs this worker runs.
#
# Metrics (PLAN.md PERF-3.1): the Prometheus JMX exporter javaagent serves
# connector/task status, source-record counts and Debezium streaming metrics
# (MilliSecondsBehindSource: the outbox -> Kafka hop) on :9404. The image
# has the entrypoint switch but not the jar, so an initContainer fetches a
# pinned one from Maven Central. Always on: it costs a little Connect heap
# headroom, and only the opt-in obs stack (bin/obs) scrapes it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-connect-jmx-exporter
  namespace: gluon-local
data:
  metrics.yaml: |
    lowercaseOutputName: true
    rules:
      # String attributes come through as "<attr>: <value>"; export 1 per state.
      - pattern: 'kafka.connect<type=connector-metrics, connector=(.+)><>status: ([a-z-]+)'
        name: kafka_connect_connector_status
        value: 1
        type: GAUGE
        labels: {connector: "$1", status: "$2"}
      - pattern: 'kafka.connect<type=connector-task-metrics, connector=(.+), task=(.+)><>status: ([a-z-]+)'
        name: kafka_connect_task_status
        value: 1
        type: GAUGE
        labels: {connector: "$1", task: "$2", status: "$3"}
      - pattern: 'kafka.connect<type=source-task-metrics, connector=(.+), task=(.+)><>(source-record-poll-total|source-record-write-total|source-record-active-count|poll-batch-avg-time-ms)'
        name: kafka_connect_source_task_$3
        type: GAUGE
        labels: {connector: "$1", task: "$2"}
      - pattern: 'kafka.connect<type=connect-worker-metrics><>(connector-count|task-count|connector-startup-failure-total|task-startup-failure-total)'
        name: kafka_connect_worker_$1
        type: GAUGE
      # Debezium: debezium.postgres:type=connector-metrics,context=streaming|snapshot,server=<prefix>[,task=0]
      - pattern: 'debezium.([^:<]+)<type=connector-metrics, context=([^,>]+), server=([^,>]+)(?:, task=[^>]+)?><>(MilliSecondsBehindSource|TotalNumberOfEventsSeen|NumberOfEventsFiltered|QueueRemainingCapacity|Connected|MilliSecondsSinceLastEvent)'
        name: debezium_$4
        type: GAUGE
        labels: {plugin: "$1", context: "$2", server: "$3"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: gluon-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-connect
  template:
    metadata:
      labels:
        app: kafka-connect
    spec:
      initContainers:
        - name: fetch-jmx-exporter
          image: curlimages/curl:8.11.1
          command:
            - curl
            - -fsSL
            - -o
            - /jmx/jmx_prometheus_javaagent.jar
            - https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/1.0.1/jmx_prometheus_javaagent-1.0.1.jar
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 32Mi
          volumeMounts:
            - name: jmx
              mountPath: /jmx
      containers:
        - name: kafka-connect
          image: debezium/connect:3.0.0.Final
          # Laptop budget (gluon PLAN.md, PERF-2.3): memory request = limit.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 1Gi
          ports:
            - containerPort: 8083
            - name: jmx
              containerPort: 9404
          env:
            - name: KAFKA_OPTS
              value: "-javaagent:/jmx/jmx_prometheus_javaagent.jar=9404:/jmx-config/metrics.yaml"
            # debezium/connect defaults to -Xmx2G.
            - name: HEAP_OPTS
              value: "-Xms256m -Xmx512m"
            - name: BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: GROUP_ID
              value: "gluon-connect"
            - name: CONFIG_STORAGE_TOPIC
              value: "connect-configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "connect-offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "connect-status"
            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            # The outbox `payload` column already holds a complete,
            # pre-built envelope JSON string (ADR 0008 - "app builds the
            # full envelope, not the SMT"). Plain StringConverter passes
            # it through to Kafka byte-for-byte, matching exactly what
            # today's direct-publish code already sends
            # (envelope.asJson.noSpaces) - no schema-registry-style
            # wrapping, consistent with ADR 0003's current no-registry
            # state.
            - name: KEY_CONVERTER
              value: "org.apache.kafka.connect.storage.StringConverter"
            - name: VALUE_CONVERTER
              value: "org.apache.kafka.connect.storage.StringConverter"
          readinessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - http://localhost:8083/
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: jmx
              mountPath: /jmx
            - name: jmx-config
              mountPath: /jmx-config
      volumes:
        - name: jmx
          emptyDir: {}
        - name: jmx-config
          configMap:
            name: kafka-connect-jmx-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: gluon-local
spec:
  selector:
    app: kafka-connect
  ports:
    - name: http
      port: 8083
      targetPort: 8083
    # Not named "metrics": that name is how Prometheus finds gluon services.
    - name: jmx
      port: 9404
      targetPort: 9404
