fields:
  - name: sku
    type: String
    example: "sku-widget-1"
    visibility: create-only
  - name: quantityAvailable
    type: Int
    example: "100"
  # TD-24: hand-edited in the service to be ledger-only (not updatable either);
  # the generator has no visibility for that yet.
  - name: quantityReserved
    type: Int
    example: "0"
    visibility: server-defaulted
    default: "0"
