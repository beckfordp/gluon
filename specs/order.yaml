fields:
  - name: customerId
    type: String
    example: "cust-123"
    visibility: create-only
  - name: totalCents
    type: Int
    example: "4999"
    visibility: create-only
  - name: status
    type: String
    example: "authorized"
    visibility: server-defaulted
    default: "authorized"
