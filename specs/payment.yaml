fields:
  - name: orderId
    type: String
    example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
    visibility: create-only
  - name: amountCents
    type: Int
    example: "4999"
    visibility: create-only
  - name: status
    type: String
    example: "pending"
    visibility: server-defaulted
    default: "pending"
