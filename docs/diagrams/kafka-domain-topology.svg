<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Inventory-service publishes stock events to inventory-events, consumed by order-service. Order-service publishes order events to order-events, consumed by payment-service and notification-service, each filtering for one event type. Payment-service publishes payment events to payment-events, consumed back by order-service. Order-service also calls inventory-service synchronously over HTTP, outside Kafka entirely.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    :root{
      --bg:#EEF1F6; --surface:#FFFFFF; --ink:#1B2433; --ink-dim:#5C6779;
      --line:#CBD3E0; --accent-sync:#2B58A6; --accent-async:#9C6318;
      --accent-soft:#FBF1E1;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#10151E; --surface:#1A212D; --ink:#E7ECF4; --ink-dim:#93A0B4;
        --line:#2C3546; --accent-sync:#6B9BF0; --accent-async:#E3A54C;
        --accent-soft:#2E2311;
      }
    }
    text{ font-family:"IBM Plex Mono","SFMono-Regular",ui-monospace,monospace; }
  </style>
  <defs>
    <marker id="arrAsync2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--accent-async)"/>
    </marker>
    <marker id="arrSync2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--accent-sync)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="var(--bg)"/>
  <rect x="0" y="0" width="1000" height="560" fill="var(--surface)"/>

  <text x="20" y="22" font-size="10.5" letter-spacing="0.06em" fill="var(--ink-dim)">BLUE = SYNC HTTP (UNCHANGED BY ADR 0009)   &#183;   AMBER = KAFKA, DOMAIN TOPIC + ENVELOPE</text>

  <!-- sync HTTP arrow, above main lane -->
  <path d="M 405,116 L 405,70 L 115,70 L 115,116" fill="none" stroke="var(--accent-sync)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrSync2)"/>
  <text x="260" y="62" font-size="10" text-anchor="middle" fill="var(--accent-sync)">POST /inventorys/reservations</text>

  <!-- service boxes, main lane -->
  <rect x="30" y="118" width="170" height="64" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="115" y="155" font-size="13" text-anchor="middle" font-weight="600" fill="var(--ink)">inventory-service</text>

  <rect x="330" y="118" width="170" height="64" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="415" y="155" font-size="13" text-anchor="middle" font-weight="600" fill="var(--ink)">order-service</text>

  <rect x="630" y="118" width="170" height="64" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="715" y="155" font-size="13" text-anchor="middle" font-weight="600" fill="var(--ink)">payment-service</text>

  <!-- topic pipes, main lane -->
  <rect x="213" y="110" width="104" height="80" rx="8" fill="var(--accent-soft)" stroke="var(--accent-async)" stroke-width="1.3"/>
  <text x="265" y="136" font-size="11" text-anchor="middle" font-weight="600" fill="var(--ink)">inventory-events</text>
  <text x="265" y="154" font-size="8.3" text-anchor="middle" fill="var(--ink-dim)">StockReserved</text>
  <text x="265" y="166" font-size="8.3" text-anchor="middle" fill="var(--ink-dim)">StockReservationFailed</text>

  <rect x="513" y="110" width="104" height="80" rx="8" fill="var(--accent-soft)" stroke="var(--accent-async)" stroke-width="1.3"/>
  <text x="565" y="136" font-size="11" text-anchor="middle" font-weight="600" fill="var(--ink)">order-events</text>
  <text x="565" y="154" font-size="8.3" text-anchor="middle" fill="var(--ink-dim)">OrderReserved</text>
  <text x="565" y="166" font-size="8.3" text-anchor="middle" fill="var(--ink-dim)">OrderStatusChanged</text>

  <rect x="813" y="110" width="104" height="80" rx="8" fill="var(--accent-soft)" stroke="var(--accent-async)" stroke-width="1.3"/>
  <text x="865" y="136" font-size="11" text-anchor="middle" font-weight="600" fill="var(--ink)">payment-events</text>
  <text x="865" y="154" font-size="8.3" text-anchor="middle" fill="var(--ink-dim)">PaymentSettled</text>
  <text x="865" y="166" font-size="8.3" text-anchor="middle" fill="var(--ink-dim)">PaymentFailed</text>

  <!-- publish/consume arrows, main lane -->
  <path d="M 200,150 L 213,150" stroke="var(--accent-async)" stroke-width="1.6" marker-end="url(#arrAsync2)"/>
  <text x="206" y="100" font-size="8.7" text-anchor="middle" fill="var(--accent-async)">publishes</text>

  <path d="M 317,150 L 330,150" stroke="var(--accent-async)" stroke-width="1.6" marker-end="url(#arrAsync2)"/>
  <text x="323" y="100" font-size="8.7" text-anchor="middle" fill="var(--accent-async)">consumes (both)</text>

  <path d="M 500,150 L 513,150" stroke="var(--accent-async)" stroke-width="1.6" marker-end="url(#arrAsync2)"/>
  <text x="506" y="100" font-size="8.7" text-anchor="middle" fill="var(--accent-async)">publishes</text>

  <path d="M 617,150 L 630,150" stroke="var(--accent-async)" stroke-width="1.6" marker-end="url(#arrAsync2)"/>
  <text x="623" y="100" font-size="8.7" text-anchor="middle" fill="var(--accent-async)">OrderReserved</text>

  <path d="M 800,150 L 813,150" stroke="var(--accent-async)" stroke-width="1.6" marker-end="url(#arrAsync2)"/>
  <text x="806" y="100" font-size="8.7" text-anchor="middle" fill="var(--accent-async)">publishes</text>

  <!-- notification branch, down from order-events -->
  <path d="M 565,190 L 565,290 L 715,290 L 715,328" fill="none" stroke="var(--accent-async)" stroke-width="1.6" marker-end="url(#arrAsync2)"/>
  <text x="610" y="283" font-size="8.7" text-anchor="middle" fill="var(--accent-async)">OrderStatusChanged</text>

  <rect x="630" y="330" width="170" height="64" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="715" y="367" font-size="13" text-anchor="middle" font-weight="600" fill="var(--ink)">notification-service</text>

  <!-- loop back, payment-events to order-service -->
  <path d="M 865,190 L 865,470 L 415,470 L 415,182" fill="none" stroke="var(--accent-async)" stroke-width="1.6" marker-end="url(#arrAsync2)"/>
  <text x="640" y="463" font-size="8.7" text-anchor="middle" fill="var(--accent-async)">consumes (both) &#8594; updates order status</text>

  <text x="20" y="525" font-size="9.5" fill="var(--ink-dim)">catalog-service and cart-service publish/consume nothing today &#8212; not shown above.</text>
  <text x="20" y="542" font-size="9.5" fill="var(--ink-dim)">Every message above carries a shared envelope: eventId, eventType, timestamp, source, correlationId, payload.</text>
</svg>
