<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="Environment pipeline: a container image is promoted from local OrbStack through dev, staging, and prod on EKS via CI; dev, staging, and prod share one AWS account separated by kubernetes namespace; containers switch to managed AWS services MSK, ElastiCache, and RDS starting at staging.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    :root{
      --bg:#EEF1F6; --surface:#FFFFFF; --ink:#1B2433; --ink-dim:#5C6779;
      --line:#CBD3E0; --accent-sync:#2B58A6; --accent-async:#9C6318;
      --accent-future:#8890A0; --store:#1F7A68;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#10151E; --surface:#1A212D; --ink:#E7ECF4; --ink-dim:#93A0B4;
        --line:#2C3546; --accent-sync:#6B9BF0; --accent-async:#E3A54C;
        --accent-future:#7A8296; --store:#4FB49E;
      }
    }
    text{ font-family:"IBM Plex Mono","SFMono-Regular",ui-monospace,monospace; }
  </style>
  <defs>
    <marker id="arrNeutral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--ink)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="300" fill="var(--bg)"/>
  <rect x="0" y="0" width="1000" height="300" fill="var(--surface)"/>

  <!-- AWS account bracket -->
  <rect x="265" y="75" width="700" height="120" rx="10" fill="none" stroke="var(--accent-sync)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="615" y="215" text-anchor="middle" font-size="11" fill="var(--ink-dim)">single AWS account — separated by k8s namespace · ADR 0004</text>

  <!-- managed-AWS divider -->
  <line x1="490" y1="62" x2="490" y2="200" stroke="var(--accent-async)" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="500" y="42" width="200" height="16" fill="var(--surface)"/>
  <text x="500" y="54" font-size="10" fill="var(--accent-async)">containers → managed AWS</text>

  <!-- CI label -->
  <rect x="445" y="24" width="340" height="16" fill="var(--surface)"/>
  <text x="615" y="36" text-anchor="middle" font-size="11" fill="var(--ink-dim)">same image tag + Helm chart, promoted via CI</text>

  <!-- boxes -->
  <rect x="30" y="100" width="170" height="70" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="115" y="130" text-anchor="middle" font-weight="600" font-size="13" fill="var(--ink)">local</text>
  <text x="115" y="148" text-anchor="middle" font-size="9.5" fill="var(--ink-dim)">OrbStack · kind for CI</text>

  <rect x="280" y="100" width="170" height="70" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="365" y="130" text-anchor="middle" font-weight="600" font-size="13" fill="var(--ink)">dev</text>
  <text x="365" y="148" text-anchor="middle" font-size="9.5" fill="var(--ink-dim)">EKS · dev ns</text>

  <rect x="530" y="100" width="170" height="70" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="615" y="130" text-anchor="middle" font-weight="600" font-size="13" fill="var(--ink)">staging</text>
  <text x="615" y="148" text-anchor="middle" font-size="9.5" fill="var(--ink-dim)">EKS · staging ns</text>

  <rect x="780" y="100" width="170" height="70" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="865" y="130" text-anchor="middle" font-weight="600" font-size="13" fill="var(--ink)">prod</text>
  <text x="865" y="148" text-anchor="middle" font-size="9.5" fill="var(--ink-dim)">EKS · prod ns</text>

  <!-- arrows -->
  <line x1="200" y1="135" x2="277" y2="135" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#arrNeutral)"/>
  <line x1="450" y1="135" x2="527" y2="135" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#arrNeutral)"/>
  <line x1="700" y1="135" x2="777" y2="135" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#arrNeutral)"/>
</svg>
